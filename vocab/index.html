<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a3a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="單字庫">
<title>單字記憶庫 Vocab Memory</title>
<link rel="manifest" href="/JeffreysLab/vocab/manifest.json">
<link rel="apple-touch-icon" href="/JeffreysLab/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1a3a1a; --green2:#2b5a2b; --lime:#CCFF00; --mint:#4ECDC4;
  --bg:#F4F1EB; --card:#ffffff; --ink:#1c1f1a; --muted:#6c6f63; --line:#e2ddd2;
  --coral:#e8604c; --amber:#e8a33c;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  overscroll-behavior:none;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
.en{font-family:'Syne',system-ui,sans-serif}

/* ── 頂部 ── */
header{background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px}
header h1{font-size:17px;font-weight:700;line-height:1.1}
header h1 small{display:block;font-family:'Syne',sans-serif;font-size:11px;font-weight:600;color:var(--lime);letter-spacing:.5px}
header .sp{flex:1}
.pill{font-size:12px;background:rgba(255,255,255,.12);border-radius:20px;padding:4px 10px;white-space:nowrap}
.pill b{color:var(--lime)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:14px 16px calc(84px + var(--safe-b));max-width:560px;margin:0 auto}
.view.active{display:block}
#v-review.active{display:flex;flex-direction:column;height:100%}

/* ── 篩選 chips ── */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
  padding:5px 12px;font-size:12px;font-weight:500}
.chip.on{background:var(--green);border-color:var(--green);color:var(--lime)}
.flabel{font-size:11px;color:var(--muted);margin:10px 0 4px;font-weight:700;letter-spacing:.5px}
.ftoggle{width:100%;border:none;background:#fff;border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted);
  display:flex;align-items:center;gap:4px;text-align:left}
.ftoggle b{color:var(--green);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpanel{display:none}.fpanel.open{display:block}

/* ── 進度條 ── */
.sessbar{display:flex;align-items:center;gap:10px;margin:12px 0 10px;font-size:12px;color:var(--muted)}
.track{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.undo{border:none;background:none;color:var(--green2);font-size:12px;font-weight:700;padding:4px 0}
.undo:disabled{color:#c4c0b4}

/* ── 卡片 ── */
.stage{position:relative;flex:1;min-height:260px;display:flex;align-items:stretch;justify-content:center;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(26,58,26,.12);
  padding:22px 20px;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;will-change:transform}
.card.anim{transition:transform .28s ease, opacity .28s ease}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;background:#eef3ea;color:var(--green2)}
.tag.lv{background:var(--green);color:var(--lime)}
.tag.warn{background:#fff1d6;color:#9a5b00}
.tag.stub{background:#fde7e2;color:#a83a26}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.word{font-family:'Syne',sans-serif;font-size:clamp(30px,9vw,44px);font-weight:800;line-height:1.1;word-break:break-word;color:var(--green)}
.ipa{font-size:16px;color:var(--muted)}
.pos{font-size:13px;color:var(--muted);font-style:italic}
.spk{width:52px;height:52px;border-radius:50%;border:none;background:var(--lime);color:var(--green);font-size:22px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(204,255,0,.4)}
.spk.small{width:34px;height:34px;font-size:15px;box-shadow:none;flex:none}
.spk.busy{opacity:.5}
.hint{font-size:12px;color:#a9a597;text-align:center}
.back{display:none;flex:1;min-height:0;flex-direction:column;gap:12px;overflow-y:auto;margin-top:12px;border-top:1.5px dashed var(--line);padding:14px 14px 4px 0;scrollbar-width:none}
.back::-webkit-scrollbar{display:none}
/* 卡片右側捲動條：背面內容超出時才出現 */
.rail{position:absolute;right:8px;width:5px;border-radius:5px;background:rgba(78,205,196,.2);display:none;pointer-events:none}
.rail i{position:absolute;left:0;right:0;border-radius:5px;background:var(--mint)}
.card.flipped .rail.on{display:block}
.card.flipped .back{display:flex}
.card.flipped .front{flex:none;padding-top:6px}
.card.flipped .word{font-size:clamp(24px,7vw,32px)}
.card.flipped .hint{display:none}
.card.flipped .front{gap:4px}
.card.flipped .pos{display:none}
.card.flipped .ipa{font-size:14px}
.card.flipped .front .spk{width:38px;height:38px;font-size:17px;box-shadow:none}
.card.flipped .back{touch-action:pan-y}   /* 背面內容可上下捲動 */
.zh{font-size:22px;font-weight:700;color:var(--ink);text-align:center}
.sec{font-size:11px;font-weight:700;color:var(--mint);letter-spacing:.6px;margin-bottom:3px}
.def{font-size:15px;line-height:1.5}
.ex{font-size:15px;line-height:1.55;font-style:italic;display:flex;gap:8px;align-items:flex-start}
.ex mark{background:rgba(204,255,0,.55);color:inherit;font-style:normal;font-weight:700;padding:0 2px;border-radius:3px}
.note{font-size:12px;color:var(--muted)}
.stamp{position:absolute;top:22px;font-family:'Syne',sans-serif;font-weight:800;font-size:22px;border:3px solid;border-radius:10px;
  padding:2px 10px;opacity:0;pointer-events:none}
.stamp.l{right:20px;color:var(--coral);transform:rotate(12deg)}
.stamp.r{left:20px;color:var(--green2);transform:rotate(-12deg)}

/* ── 評分按鈕 ── */
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.rbtn{border:none;border-radius:16px;padding:12px 4px;font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.rbtn span{font-size:11px;font-weight:500;opacity:.8}
.r1{background:#fde7e2;color:#a83a26}
.r3{background:var(--green);color:var(--lime)}
.r4{background:#dcf5f2;color:#0f6e66}

/* ── 空狀態／完成 ── */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:30px 10px}
.done .big{font-size:46px}
.done h2{font-size:20px}
.done p{color:var(--muted);font-size:14px;line-height:1.6}
.btn{border:none;border-radius:14px;padding:11px 18px;font-size:14px;font-weight:700;background:var(--green);color:var(--lime)}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--line)}
.btn.danger{background:#fde7e2;color:#a83a26}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ── 單字庫列表 ── */
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:15px;background:#fff;font-family:inherit}
.search:focus{outline:none;border-color:var(--mint)}
.list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.row{background:#fff;border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.row .main{flex:1;min-width:0}
.row .w{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:var(--green)}
.row .z{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{text-align:right;font-size:11px;color:var(--muted);flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-new{background:#cfcabd}.d-learn{background:var(--amber)}.d-known{background:var(--mint)}.d-hard{background:var(--coral)}
.count{font-size:12px;color:var(--muted);margin-top:10px}

/* ── 進度 ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:16px;padding:14px}
.stat b{display:block;font-family:'Syne',sans-serif;font-size:28px;color:var(--green)}
.stat span{font-size:12px;color:var(--muted)}
.stat.hl{background:var(--green)}
.stat.hl b{color:var(--lime)}.stat.hl span{color:#cfe3cf}
h3{font-size:14px;margin:20px 0 8px}
.bars{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:16px;padding:14px}
.bar{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:8px;font-size:12px}
.stack{height:12px;border-radius:6px;overflow:hidden;display:flex;background:#efebe2}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}

/* ── 設定 ── */
.set{background:#fff;border-radius:16px;padding:4px 14px;margin-bottom:12px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f0ece3;font-size:14px}
.srow:last-child{border-bottom:none}
.srow small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:none;background:#fff;padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--green);color:var(--lime);font-weight:700}
.sw{width:46px;height:28px;border-radius:14px;background:#d8d3c6;position:relative;border:none;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
.input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;font-family:monospace}
.diag{font-size:11px;font-family:monospace;color:var(--muted);white-space:pre-wrap;word-break:break-all;background:#f7f5ef;border-radius:10px;padding:8px;margin:8px 0;display:none}

/* ── 底部分頁 ── */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;
  padding-bottom:var(--safe-b);z-index:50}
nav button{flex:1;border:none;background:none;padding:8px 0 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px;line-height:1.1}
nav button.on{color:var(--green);font-weight:700}

/* ── 單字詳情 ── */
.modal{position:fixed;inset:0;background:rgba(10,20,10,.45);display:none;align-items:flex-end;justify-content:center;z-index:80}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b))}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--green);color:#fff;
  font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>單字記憶庫<small>VOCAB MEMORY</small></h1>
  <div class="sp"></div>
  <div class="pill" id="hdrDue">今日 <b>0</b></div>
</header>

<main>
  <!-- ═══ 複習 ═══ -->
  <section class="view active" id="v-review">
    <button class="ftoggle" id="fToggle">🔍 篩選：<b id="fSummary">全部</b><span>▾</span></button>
    <div class="fpanel" id="fPanel">
      <div class="flabel">難度</div>
      <div class="chips" id="fLevel"></div>
      <div class="flabel">領域</div>
      <div class="chips" id="fDomain"></div>
    </div>

    <div class="sessbar">
      <span id="sessTxt">0 / 0</span>
      <div class="track"><i id="sessBar"></i></div>
      <button class="undo" id="undoBtn" disabled>↶ 復原</button>
    </div>

    <div class="stage" id="stage"></div>

    <div class="rate" id="rateBtns">
      <button class="rbtn r1" data-g="1">✕ 不熟<span>← 左滑</span></button>
      <button class="rbtn r3" data-g="3">✓ 記得<span>右滑 →</span></button>
      <button class="rbtn r4" data-g="4">★ 太簡單<span>點按</span></button>
    </div>
  </section>

  <!-- ═══ 單字庫 ═══ -->
  <section class="view" id="v-list">
    <input class="search" id="search" type="search" placeholder="搜尋英文或中文…">
    <div class="flabel">狀態</div>
    <div class="chips" id="fStatus"></div>
    <div class="count" id="listCount"></div>
    <div class="list" id="list"></div>
  </section>

  <!-- ═══ 進度 ═══ -->
  <section class="view" id="v-stats">
    <div class="stats" id="statCards"></div>
    <h3>各難度掌握度</h3>
    <div class="bars" id="lvBars"></div>
    <div class="legend">
      <span><i class="dot d-known"></i>已記得</span><span><i class="dot d-learn"></i>學習中</span>
      <span><i class="dot d-hard"></i>頑固字</span><span><i class="dot d-new"></i>未學</span>
    </div>
    <h3>頑固字（不熟 3 次以上）</h3>
    <div class="list" id="hardList"></div>
  </section>

  <!-- ═══ 設定 ═══ -->
  <section class="view" id="v-set">
    <div class="set">
      <div class="srow"><div>每日新字數<small>每天最多加入幾個新字</small></div>
        <div class="seg" id="sNew"></div></div>
      <div class="srow"><div>目標記憶率<small>越高複習越頻繁</small></div>
        <div class="seg" id="sRet"></div></div>
      <div class="srow"><div>自動發音<small>卡片出現時自動朗讀</small></div>
        <button class="sw" id="sAuto"></button></div>
    </div>

    <div class="set">
      <div class="srow" style="display:block">
        <div>資料來源（Google Sheet CSV）<small id="syncInfo">—</small></div>
        <input class="input" id="sCsv" style="margin-top:8px">
        <div class="btnrow" style="justify-content:flex-start;margin-top:8px">
          <button class="btn" id="btnSync">立即同步</button>
        </div>
      </div>
    </div>

    <div class="set">
      <div class="srow" style="display:block">
        <div>語音<small id="ttsInfo">Gateway generate_tts（失敗時改用瀏覽器語音）</small></div>
        <div class="diag" id="ttsDiag"></div>
        <div class="btnrow" style="justify-content:flex-start;margin-top:8px">
          <button class="btn ghost" id="btnTtsTest">測試語音</button>
          <button class="btn ghost" id="btnTtsClear">清除語音快取</button>
        </div>
      </div>
    </div>

    <div class="set">
      <div class="srow" style="display:block">
        <div>學習進度備份<small>進度只存在這台裝置，換手機前請先匯出</small></div>
        <div class="btnrow" style="justify-content:flex-start;margin-top:8px">
          <button class="btn ghost" id="btnExport">匯出 JSON</button>
          <button class="btn ghost" id="btnImport">匯入 JSON</button>
          <button class="btn danger" id="btnReset">重設全部進度</button>
        </div>
        <input type="file" id="fileImport" accept="application/json,.json" hidden>
      </div>
    </div>
    <p class="hint">電腦版快捷鍵：空白鍵翻面　← 不熟　→ 記得　↑ 太簡單　P 發音　Z 復原</p>
  </section>
</main>

<nav id="nav">
  <button data-v="v-review" class="on"><i>🃏</i>複習</button>
  <button data-v="v-list"><i>📚</i>單字庫</button>
  <button data-v="v-stats"><i>📈</i>進度</button>
  <button data-v="v-set"><i>⚙️</i>設定</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  設定常數
// ═══════════════════════════════════════════════════════
const DEFAULT_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTO_bharOpUJoM9mtTLA3ZDG2QpjCQsku_deI9UElCh6fbGgkG4aMU_D2GiFIF-6sSTpewcUgKy4QwI/pub?output=csv';
const GATEWAY_URL   = 'https://script.google.com/macros/s/AKfycbz0O6eB9fVC3Xp7g0Kt4U-32Inmf9ieDYJygEf3jW78xaWx10glPscEefEQwgB0jCioug/exec';
const GATEWAY_TOKEN = 'MYVIEWBOARDgoogleAPI';
const LEVELS = ['A1','A2','B1','B2','C1','C2'];
const DAY = 86400000;
const KNOWN_DAYS = 21;   // 穩定度 ≥ 21 天算「已記得」
const HARD_FAILS = 3;    // 不熟 ≥ 3 次算「頑固字」

// ═══════════════════════════════════════════════════════
//  IndexedDB（進度、單字快取、語音快取）
// ═══════════════════════════════════════════════════════
const db = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('vocab-memory', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('kv', mode), s = t.objectStore('kv');
      const req = fn(s);
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: (k) => tx('readonly', (s) => s.get(k)),
    set: (k, v) => tx('readwrite', (s) => s.put(v, k)),
    del: (k) => tx('readwrite', (s) => s.delete(k)),
    keys: () => tx('readonly', (s) => s.getAllKeys()),
  };
})();

// ═══════════════════════════════════════════════════════
//  FSRS-4.5（預設參數）
// ═══════════════════════════════════════════════════════
const FSRS = (() => {
  const w = [0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
  const DECAY = -0.5, FACTOR = 19 / 81;
  const clampD = (d) => Math.min(10, Math.max(1, d));
  const d0 = (g) => clampD(w[4] - (g - 3) * w[5]);
  const retr = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
  const interval = (s, r) => Math.min(36500, Math.max(1, Math.round(s / FACTOR * (Math.pow(r, 1 / DECAY) - 1))));
  function next(card, g, now) {
    // g: 1 不熟 / 3 記得 / 4 太簡單
    if (!card) return { S: w[g - 1], D: d0(g), last: now };
    const t = Math.max(0, (now - card.last) / DAY);
    const R = retr(t, card.S);
    let D = clampD(w[7] * d0(3) + (1 - w[7]) * (card.D - w[6] * (g - 3)));
    let S;
    if (g === 1) {
      S = w[11] * Math.pow(card.D, -w[12]) * (Math.pow(card.S + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R));

const st = {

  prog: {},                         // id → {S,D,last,due,reps,fails}
  meta: { day: '', newToday: 0, reviewDays: [] },
  set: { newPerDay: 10, retention: 0.9, autoSpeak: true, levels: [], domains: [], csvUrl: DEFAULT_CSV, syncedAt: 0 },
  queue: [], cur: null, flipped: false,
  sess: { total: 0, done: 0, again: 0 }, undoStack: [],
  listStatus: 'all',

const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const $ = (id) => document.getElementById(id);

// ═══════════════════════════════════════════════════════
//  CSV 讀取與解析
// ═══════════════════════════════════════════════════════
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function rowsToWords(rows) {
  const h = rows[0].map((x) => x.trim());
  const col = (name) => h.indexOf(name);
  const C = { id: col('ID'), w: col('單字'), type: col('類型'), pos: col('詞性'), ipa: col('音標'), zh: col('中文'),
    def: col('英文定義'), ex: col('例句'), lv: col('難度'), dom: col('領域'), topic: col('原圖主題'), status: col('狀態'), note: col('備註') };
  if (C.w < 0) throw new Error('CSV 找不到「單字」欄');
  const g = (r, i) => (i >= 0 && r[i] != null ? r[i].trim() : '');
  return rows.slice(1).filter((r) => g(r, C.w)).map((r, i) => ({
    id: g(r, C.id) || ('W' + i + ':' + g(r, C.w).toLowerCase()),
    word: g(r, C.w), type: g(r, C.type), pos: g(r, C.pos), ipa: g(r, C.ipa), zh: g(r, C.zh), def: g(r, C.def),
    ex: g(r, C.ex), lv: g(r, C.lv).toUpperCase(), dom: g(r, C.dom), topic: g(r, C.topic), status: g(r, C.status), note: g(r, C.note),
  }));
}
function setWords(words) {
  st.words = words; st.byId = {};
  words.forEach((w) => (st.byId[w.id] = w));
}
async function syncCSV(manual) {
  try {
    const res = await fetch(st.set.csvUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const words = rowsToWords(parseCSV(await res.text()));
    if (!words.length) throw new Error('沒有讀到任何單字');
    const added = words.filter((w) => !st.byId[w.id]).length;
    setWords(words);
    await db.set('words', words);
    st.set.syncedAt = Date.now(); saveSet();
    if (manual) toast('已同步 ' + words.length + ' 筆' + (added ? '，新增 ' + added + ' 筆' : ''));
    return true;
  } catch (e) {
    if (manual || !st.words.length) toast('同步失敗：' + e.message + (st.words.length ? '（使用離線資料）' : ''));
    return false;
  }
}

// ═══════════════════════════════════════════════════════
//  語音：Gateway generate_tts → 快取 → 失敗改用瀏覽器語音
// ═══════════════════════════════════════════════════════
const tts = { audio: new Audio(), inflight: {}, lastDiag: '', fails: 0 };
const plan = localStorage.getItem('newcore_tools_plan');
const useFreeKey = (plan !== 'pro');

function b64ToBytes(b64) {
  const bin = atob(b64.replace(/\s/g, '')); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function pcmToWav(pcm, rate) {   // Gemini TTS 回傳 16-bit PCM，需要包 WAV 標頭才能播放
  const h = new ArrayBuffer(44), v = new DataView(h);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + pcm.length, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, 'data'); v.setUint32(40, pcm.length, true);

// 在回應裡找音訊：支援 Google Cloud TTS（audioContent）、Gemini（inlineData）、網址或 data URI
function findAudio(obj, depth = 0) {

  if (typeof obj === 'string') {
    if (/^https?:\/\//.test(obj)) return { url: obj };
    const m = obj.match(/^data:([^;]+);base64,(.+)$/s);
    if (m) return { b64: m[2], mime: m[1] };
    return null;
  }
  if (typeof obj !== 'object') return null;
  for (const k of ['audioContent', 'audio', 'audioBase64', 'base64', 'audioData']) {
    if (typeof obj[k] === 'string' && obj[k].length > 100) {
      const inner = findAudio(obj[k], depth + 1);
      return inner || { b64: obj[k], mime: obj.mimeType || obj.mime || 'audio/mpeg' };
    }
  }
  if (obj.inlineData && typeof obj.inlineData.data === 'string')
    return { b64: obj.inlineData.data, mime: obj.inlineData.mimeType || 'audio/L16;rate=24000' };
  if (typeof obj.data === 'string' && obj.data.length > 100 && obj.mimeType) return { b64: obj.data, mime: obj.mimeType };
  if (typeof obj.url === 'string' && /^https?:/.test(obj.url)) return { url: obj.url };
  for (const k of Object.keys(obj)) { const r = findAudio(obj[k], depth + 1); if (r) return r; }

}
function describe(obj, depth = 0) {   // 診斷用：列出回應結構，長字串截斷
  if (typeof obj === 'string') return obj.length > 40 ? '"' + obj.slice(0, 30) + '…" (' + obj.length + ' 字)' : JSON.stringify(obj);
  if (!obj || typeof obj !== 'object' || depth > 3) return JSON.stringify(obj);
  return '{ ' + Object.keys(obj).map((k) => k + ': ' + describe(obj[k], depth + 1)).join(', ') + ' }';
}
async function fetchTTS(text) {
  const res = await fetch(GATEWAY_URL, {
    method: 'POST',
    redirect: 'follow',          // 鐵律：一定要加；且不加 Content-Type
    body: JSON.stringify({
      auth: GATEWAY_TOKEN,
      action: 'generate_tts',
      params: { text, prompt: text, languageCode: 'en-US', useFreeKey },
    }),
  });
  const gw = await res.json();
  tts.lastDiag = describe(gw);
  if (!gw.ok) throw new Error(gw.error || 'Gateway 失敗');
  const a = findAudio(gw);
  if (!a) throw new Error('回應中找不到音訊');
  if (a.url) { const r = await fetch(a.url); return await r.blob(); }
  const bytes = b64ToBytes(a.b64);
  const mime = (a.mime || '').toLowerCase();
  if (mime.includes('l16') || mime.includes('pcm')) {
    const rate = parseInt((mime.match(/rate=(\d+)/) || [])[1] || '24000', 10);

  }

}
async function getAudio(text) {

  const hit = await db.get(key);
  if (hit) return hit;
  if (!navigator.onLine) throw new Error('離線');
  if (tts.fails >= 2) throw new Error('Gateway 連續失敗，本次改用瀏覽器語音');
  if (!tts.inflight[key]) {
    tts.inflight[key] = fetchTTS(text)
      .then(async (blob) => { tts.fails = 0; await db.set(key, blob); return blob; })
      .catch((e) => { tts.fails++; throw e; })
      .finally(() => delete tts.inflight[key]);
  }

}
function browserSpeak(text) {
  if (!('speechSynthesis' in window)) return;

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find((x) => /en-US/.test(x.lang) && /(Samantha|Google|Natural|Neural)/.test(x.name));

async function speak(text, btn) {

    const blob = await getAudio(text);

// ═══════════════════════════════════════════════════════
//  狀態判定
// ═══════════════════════════════════════════════════════
function statusOf(w) {
  const p = st.prog[w.id];
  if (!p) return 'new';
  if (p.fails >= HARD_FAILS && p.S < KNOWN_DAYS) return 'hard';
  return p.S >= KNOWN_DAYS ? 'known' : 'learn';
}
const STATUS = { new: ['未學', 'd-new'], learn: ['學習中', 'd-learn'], known: ['已記得', 'd-known'], hard: ['頑固字', 'd-hard'] };
function inFilter(w) {
  const { levels, domains } = st.set;
  return (!levels.length || levels.includes(w.lv)) && (!domains.length || domains.includes(w.dom));
}
function dueLabel(p) {
  if (!p) return '';
  const d = Math.round((p.due - Date.now()) / DAY);
  if (p.due <= Date.now()) return '待複習';
  return d < 1 ? '今天稍後' : d === 1 ? '明天' : d + ' 天後';
}

// ═══════════════════════════════════════════════════════
//  複習佇列
// ═══════════════════════════════════════════════════════
function rollDay() {
  const k = todayKey();
  if (st.meta.day !== k) { st.meta.day = k; st.meta.newToday = 0; saveMeta(); }
}
function countDue() {
  const now = Date.now();
  const pool = st.words.filter(inFilter);
  const due = pool.filter((w) => st.prog[w.id] && st.prog[w.id].due <= now).length;
  const fresh = Math.min(pool.filter((w) => !st.prog[w.id]).length, Math.max(0, st.set.newPerDay - st.meta.newToday));
  return { due, fresh };
}
function buildQueue(extraNew = 0) {
  rollDay();
  const now = Date.now();
  const pool = st.words.filter(inFilter);
  const due = pool.filter((w) => st.prog[w.id] && st.prog[w.id].due <= now)
                  .sort((a, b) => st.prog[a.id].due - st.prog[b.id].due);
  const newLeft = Math.max(0, st.set.newPerDay - st.meta.newToday) + extraNew;
  const fresh = pool.filter((w) => !st.prog[w.id]).slice(0, newLeft);
  // 新字穿插在複習字之間（每 3 個複習字插 1 個新字）
  const q = []; let i = 0, j = 0;
  while (i < due.length || j < fresh.length) {
    for (let k = 0; k < 3 && i < due.length; k++) q.push(due[i++]);
    if (j < fresh.length) q.push(fresh[j++]);
  }
  st.queue = q.map((w) => w.id);
  st.sess = { total: st.queue.length, done: 0, again: 0 };
  st.undoStack = [];
  nextCard();
}
function practiceHard() {
  const ids = st.words.filter(inFilter).filter((w) => statusOf(w) === 'hard' || (st.prog[w.id] && st.prog[w.id].fails > 0 && statusOf(w) !== 'known')).map((w) => w.id);
  if (!ids.length) { toast(st.set.levels.length || st.set.domains.length ? '這個篩選裡沒有不熟的字' : '目前沒有不熟的字'); return; }
  st.queue = ids.sort(() => Math.random() - 0.5);
  st.sess = { total: st.queue.length, done: 0, again: 0 };
  st.undoStack = [];
  showView('v-review');
  nextCard();
}

function nextCard() {
  st.cur = st.queue.length ? st.byId[st.queue.shift()] : null;
  if (st.cur === undefined) return nextCard();   // 單字已從 Sheet 刪除
  st.flipped = false;
  renderCard();
  renderSess();
  if (st.cur) {
    if (st.set.autoSpeak) speak(st.cur.word);
    if (st.queue.length) prefetch(st.byId[st.queue[0]] && st.byId[st.queue[0]].word);
  }
}

function rate(g) {
  const w = st.cur; if (!w) return;
  const now = Date.now();
  const prev = st.prog[w.id] ? { ...st.prog[w.id] } : null;
  st.undoStack.push({ id: w.id, prev, queue: st.queue.slice(), sess: { ...st.sess }, newToday: st.meta.newToday });
  if (st.undoStack.length > 20) st.undoStack.shift();

  const n = FSRS.next(prev, g, now);
  const p = { ...(prev || { reps: 0, fails: 0 }), ...n };
  p.reps++;
  if (g === 1) {
    p.fails++;
    p.due = now + 10 * 60000;                       // 10 分鐘後再出現
    st.queue.splice(Math.min(3, st.queue.length), 0, w.id);   // 本輪 3 張後再考一次
    st.sess.again++;
  } else {

    st.sess.done++;
  }
  if (!prev) { st.meta.newToday++; }

  const u = st.undoStack.pop(); if (!u) return;

  st.cur = st.byId[u.id]; st.flipped = false;
  saveProg(); saveMeta();
  renderCard(); renderSess();

// ═══════════════════════════════════════════════════════
//  卡片繪製與手勢
// ═══════════════════════════════════════════════════════

function flyOut(g) {

      moved = true;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';   // 上下 = 捲動，左右 = 評分
      if (axis === 'x') card.setPointerCapture(e.pointerId);
    }
    if (axis !== 'x') return;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    stamps.l.style.opacity = Math.min(1, Math.max(0, -dx / 90));
    stamps.r.style.opacity = Math.min(1, Math.max(0, dx / 90));
  });
  const end = () => {
    if (!down) return; down = false;
    if (!moved) { card.style.transform = ''; flip(); return; }
    if (dx < -90) return flyOut(1);
    if (dx > 90) return flyOut(3);
    card.classList.add('anim'); card.style.transform = '';
    Object.values(stamps).forEach((s) => (s.style.opacity = 0));
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

// ═══════════════════════════════════════════════════════
//  篩選、列表、進度、設定
// ═══════════════════════════════════════════════════════
function renderFilters() {
  const lvs = LEVELS.filter((l) => st.words.some((w) => w.lv === l));
  const doms = [...new Set(st.words.map((w) => w.dom).filter(Boolean))];
  const chip = (val, on, grp) => `<button class="chip ${on ? 'on' : ''}" data-grp="${grp}" data-val="${esc(val)}">${esc(val || '全部')}</button>`;
  $('fLevel').innerHTML = chip('', !st.set.levels.length, 'lv') + lvs.map((l) => chip(l, st.set.levels.includes(l), 'lv')).join('');
  $('fDomain').innerHTML = chip('', !st.set.domains.length, 'dom') + doms.map((d) => chip(d, st.set.domains.includes(d), 'dom')).join('');
  $('fSummary').textContent = [...st.set.levels, ...st.set.domains].join('、') || '全部';
}
function toggleFilter(grp, val) {
  const key = grp === 'lv' ? 'levels' : 'domains';
  if (!val) st.set[key] = [];
  else st.set[key] = st.set[key].includes(val) ? st.set[key].filter((x) => x !== val) : [...st.set[key], val];
  saveSet(); renderFilters(); buildQueue();
}

function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const sts = [['all', '全部'], ['new', '未學'], ['learn', '學習中'], ['known', '已記得'], ['hard', '頑固字']];
  $('fStatus').innerHTML = sts.map(([k, l]) => `<button class="chip ${st.listStatus === k ? 'on' : ''}" data-st="${k}">${l}</button>`).join('');
  const items = st.words.filter((w) =>
    (st.listStatus === 'all' || statusOf(w) === st.listStatus) &&
    (!q || w.word.toLowerCase().includes(q) || w.zh.includes(q)));
  $('listCount').textContent = `共 ${items.length} 筆`;
  $('list').innerHTML = items.map(rowHTML).join('') || '<p class="hint" style="margin-top:20px">沒有符合的單字</p>';
}
function rowHTML(w) {
  const s = statusOf(w), p = st.prog[w.id];
  return `<div class="row" data-id="${esc(w.id)}">
    <i class="dot ${STATUS[s][1]}"></i>
    <div class="main"><div class="w">${esc(w.word)}</div><div class="z">${esc(w.zh)}</div></div>
    <div class="meta">${esc(w.lv)}<br>${p ? dueLabel(p) : ''}</div>
    <button class="spk small" data-say="${esc(w.word)}">🔊</button></div>`;
}
function openDetail(id) {
  const w = st.byId[id]; if (!w) return;
  const p = st.prog[id];
  $('sheet').innerHTML = `<div class="card" style="position:relative;inset:auto;box-shadow:none">${cardHTML(w, true)}</div>
    <div class="note" style="margin:12px 4px">${esc(w.topic ? '原圖主題：' + w.topic : '')}
      ${p ? `　下次複習：${dueLabel(p)}　穩定度 ${p.S.toFixed(1)} 天` : '　尚未學習'}</div>
    <div class="btnrow">${p ? `<button class="btn danger" data-reset="${esc(id)}">重設這個字</button>` : ''}
      <button class="btn ghost" data-close="1">關閉</button></div>`;
  $('sheet').querySelector('.card').classList.add('flipped');
  $('modal').classList.add('show');
}

function renderStats() {
  const counts = { new: 0, learn: 0, known: 0, hard: 0 };
  st.words.forEach((w) => counts[statusOf(w)]++);
  const c = countDue();
  const streak = (() => {
    let n = 0; const d = new Date();
    for (;;) {
      const k = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      if (st.meta.reviewDays.includes(k)) { n++; d.setDate(d.getDate() - 1); }
      else if (n === 0 && k === todayKey()) { d.setDate(d.getDate() - 1); }
      else break;
    }
    return n;
  })();
  $('statCards').innerHTML = `
    <div class="stat hl"><b>${c.due + c.fresh}</b><span>今日待學（含新字）</span></div>
    <div class="stat"><b>${streak}</b><span>連續學習天數</span></div>
    <div class="stat"><b>${counts.known}</b><span>已記得（≥${KNOWN_DAYS} 天）</span></div>
    <div class="stat"><b>${counts.learn + counts.hard}</b><span>學習中</span></div>`;
  const lvs = LEVELS.filter((l) => st.words.some((w) => w.lv === l));
  $('lvBars').innerHTML = lvs.map((l) => {
    const ws = st.words.filter((w) => w.lv === l), n = ws.length;
    const k = { known: 0, learn: 0, hard: 0, new: 0 };
    ws.forEach((w) => k[statusOf(w)]++);
    const seg = (v, col) => v ? `<i style="width:${v / n * 100}%;background:${col}"></i>` : '';
    return `<div class="bar"><b>${l}</b><div class="stack">${seg(k.known, 'var(--mint)')}${seg(k.learn, 'var(--amber)')}${seg(k.hard, 'var(--coral)')}${seg(k.new, '#cfcabd')}</div><span>${n}</span></div>`;
  }).join('') || '<p class="hint">尚無資料</p>';
  const hard = st.words.filter((w) => statusOf(w) === 'hard');
  $('hardList').innerHTML = hard.length
    ? hard.map(rowHTML).join('') + '<div class="btnrow" style="margin-top:8px"><button class="btn" data-act="hard">練習頑固字</button></div>'
    : '<p class="hint">還沒有頑固字 👍</p>';
}

function renderSettings() {
  $('sNew').innerHTML = [5, 10, 15, 20].map((n) => `<button class="${st.set.newPerDay === n ? 'on' : ''}" data-new="${n}">${n}</button>`).join('');
  $('sRet').innerHTML = [0.85, 0.9, 0.95].map((r) => `<button class="${st.set.retention === r ? 'on' : ''}" data-ret="${r}">${Math.round(r * 100)}%</button>`).join('');
  $('sAuto').classList.toggle('on', st.set.autoSpeak);
  $('sCsv').value = st.set.csvUrl;
  $('syncInfo').textContent = `${st.words.length} 筆・上次同步 ${st.set.syncedAt ? new Date(st.set.syncedAt).toLocaleString('zh-TW') : '—'}`;
}

function showView(id) {
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === id));
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === id));
  if (id === 'v-list') renderList();
  if (id === 'v-stats') renderStats();
  if (id === 'v-set') renderSettings();
  document.querySelector('main').scrollTo(0, 0);
}

// ═══════════════════════════════════════════════════════
//  事件
// ═══════════════════════════════════════════════════════
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-id]'); if (!t) return;
  if (t.dataset.say) { e.stopPropagation(); return speak(t.dataset.say, t); }
  if (t.dataset.v) return showView(t.dataset.v);
  if (t.dataset.grp) return toggleFilter(t.dataset.grp, t.dataset.val);
  if (t.dataset.g) return flyOut(+t.dataset.g);
  if (t.dataset.st) { st.listStatus = t.dataset.st; return renderList(); }
  if (t.dataset.act === 'start') return buildQueue();
  if (t.dataset.act === 'more') return buildQueue(5);
  if (t.dataset.act === 'hard') return practiceHard();
  if (t.dataset.new) { st.set.newPerDay = +t.dataset.new; saveSet(); renderSettings(); return; }
  if (t.dataset.ret) { st.set.retention = +t.dataset.ret; saveSet(); renderSettings(); return; }
  if (t.dataset.close) return $('modal').classList.remove('show');
  if (t.dataset.reset) {
    if (!confirm('重設這個字的學習進度？')) return;
    delete st.prog[t.dataset.reset]; saveProg(); $('modal').classList.remove('show'); renderList(); return;
  }
  if (t.dataset.id && t.classList.contains('row')) return openDetail(t.dataset.id);
});
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') $('modal').classList.remove('show'); });
$('undoBtn').onclick = undo;
$('fToggle').onclick = () => $('fPanel').classList.toggle('open');
$('search').oninput = renderList;
$('sAuto').onclick = () => { st.set.autoSpeak = !st.set.autoSpeak; saveSet(); renderSettings(); };
$('btnSync').onclick = async () => {
  st.set.csvUrl = $('sCsv').value.trim() || DEFAULT_CSV; saveSet();
  if (await syncCSV(true)) { renderFilters(); renderSettings(); if (!st.cur) buildQueue(); }
};
$('btnTtsTest').onclick = async () => {
  const d = $('ttsDiag'); d.style.display = 'block'; d.textContent = '呼叫中…';
  try {
    await db.del('tts:hello'); tts.fails = 0;
    const blob = await getAudio('Hello');
    tts.audio.src = URL.createObjectURL(blob); tts.audio.play().catch(() => {});
    d.textContent = '✅ Gateway 語音正常（' + blob.type + '，' + Math.round(blob.size / 1024) + ' KB）\n回應結構：' + tts.lastDiag;
  } catch (err) {
    d.textContent = '❌ ' + err.message + '\n回應結構：' + (tts.lastDiag || '（無）') + '\n→ 目前會改用瀏覽器語音';
    browserSpeak('Hello');
  }
};
$('btnTtsClear').onclick = async () => {
  const ks = (await db.keys()).filter((k) => String(k).startsWith('tts:'));
  for (const k of ks) await db.del(k);
  toast('已清除 ' + ks.length + ' 筆語音快取');
};
$('btnExport').onclick = () => {
  const data = { app: 'vocab-memory', version: 1, exportedAt: new Date().toISOString(), prog: st.prog, meta: st.meta, settings: st.set };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  a.download = 'vocab-progress-' + todayKey() + '.json'; a.click();
};
$('btnImport').onclick = () => $('fileImport').click();
$('fileImport').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'vocab-memory' || !data.prog) throw new Error('不是單字庫的備份檔');
    if (!confirm(`匯入 ${Object.keys(data.prog).length} 筆進度？目前裝置上的進度會被取代。`)) return;
    st.prog = data.prog; st.meta = { ...st.meta, ...data.meta };
    await saveProg(); await saveMeta();
    toast('匯入完成'); buildQueue(); renderSettings();
  } catch (err) { toast('匯入失敗：' + err.message); }
  e.target.value = '';
};
$('btnReset').onclick = async () => {
  if (!confirm('確定重設全部學習進度？建議先匯出備份。')) return;
  st.prog = {}; st.meta = { day: todayKey(), newToday: 0, reviewDays: [] };
  await saveProg(); await saveMeta(); toast('已重設'); buildQueue();
};
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || !$('v-review').classList.contains('active')) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); flip(); }
  else if (k === 'ArrowLeft') flyOut(1);
  else if (k === 'ArrowRight') flyOut(3);
  else if (k === 'ArrowUp') { e.preventDefault(); flyOut(4); }
  else if (k === 'p' || k === 'P') st.cur && speak(st.cur.word);
  else if (k === 'z' || k === 'Z') undo();
});

// ═══════════════════════════════════════════════════════
//  啟動
// ═══════════════════════════════════════════════════════
(async function init() {
  const [prog, meta, set, words] = await Promise.all([db.get('prog'), db.get('meta'), db.get('settings'), db.get('words')]);
  if (prog) st.prog = prog;
  if (meta) st.meta = { ...st.meta, ...meta };
  if (set) st.set = { ...st.set, ...set };
  if (words && words.length) setWords(words);
  renderFilters();
  buildQueue();
  // 背景同步 Sheet；資料有變動且沒在複習中才重排
  const before = st.words.length;
  if (await syncCSV(false)) {
    renderFilters();
    if (!st.cur || !before) buildQueue();
    else renderSess();
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/JeffreysLab/vocab/sw.js', { scope: '/JeffreysLab/vocab/' }).catch(() => {});
  }
})();
</script>
